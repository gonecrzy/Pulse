name: Sindri fork image
run-name: Sindri fork image ${{ github.sha }}

# The stable image channel is sourced only from the `sindri` branch. Manual
# runs may qualify and publish only the repository default branch, which is
# `sindri`; the published reference remains commit-specific and immutable.
on:
  push:
    branches:
      - sindri
  workflow_dispatch:

concurrency:
  group: sindri-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repository-tests:
    name: Build and Test
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read

  repository-governance:
    name: Canonical Governance
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    uses: ./.github/workflows/canonical-governance.yml
    permissions:
      contents: read

  repository-boundary-audit:
    name: Repo Boundary Audit
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    uses: ./.github/workflows/repo-boundary-audit.yml
    permissions:
      contents: read

  qualify:
    name: Build and smoke-test linux/amd64
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    needs:
      - repository-tests
      - repository-governance
      - repository-boundary-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # No cache-from/cache-to is configured. This job has no package-write
      # permission and does not receive commercial or signing secrets.
      - name: Build the existing release runtime target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: local/pulse:${{ github.sha }}
          build-args: |
            GO_BUILD_TAGS=release
            SOURCE_REVISION=${{ github.sha }}

      - name: Smoke-test the built image
        run: deploy/sindri/verify-image.sh "local/pulse:${GITHUB_SHA}" "${GITHUB_SHA}"

      - name: Save the qualified image for publication
        run: docker save --output "${RUNNER_TEMP}/pulse-runtime.tar" "local/pulse:${GITHUB_SHA}"

      - name: Transfer the exact qualified image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-runtime.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record build qualification
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '%s\n' '## Fork image build qualification'
            printf '\n'
            printf '%s\n' "- Source revision: ${SOURCE_REVISION}"
            printf '%s\n' '- Target: `runtime` (`linux/amd64`, Go `release` build tag)'
            printf '%s\n' '- Result: Docker build, executable/entrypoint checks, health check and isolated data-volume restart test passed.'
            printf '%s\n' '- Commercial/license and signing secrets: not supplied or required by this source build.'
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"]).read_text(encoding="utf-8")
          required = [
              "## Fork image build qualification",
              f"- Source revision: {os.environ['SOURCE_REVISION']}",
              "- Target: `runtime` (`linux/amd64`, Go `release` build tag)",
          ]
          missing = [line for line in required if line not in summary]
          if missing:
              raise SystemExit(f"Build summary is missing expected lines: {missing!r}")
          PY

  publish:
    name: Publish exact-SHA image to GHCR
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    needs: qualify
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the qualified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-runtime

      - name: Load and verify qualified image identity
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/pulse-runtime/pulse-runtime.tar"
          image="local/pulse:${SOURCE_REVISION}"
          actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
          test "${actual}" = "${SOURCE_REVISION}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}")" = "linux/amd64"
          docker tag "${image}" "ghcr.io/gonecrzy/pulse:${SOURCE_REVISION}"

      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      - name: Publish and record registry digest
        id: publish
        env:
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_REF: ghcr.io/gonecrzy/pulse:${{ github.sha }}
        run: |
          set -euo pipefail
          push_log="$(docker push "${IMAGE_REF}" 2>&1)" || {
            printf '%s\n' "${push_log}"
            echo "GHCR publication failed. Confirm repository Actions package-write permission and the package's repository access settings; no personal access token is used." >&2
            exit 1
          }
          printf '%s\n' "${push_log}"
          digest="$(printf '%s\n' "${push_log}" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not read the published OCI digest from docker push output." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            printf '%s\n' '## Published fork image'
            printf '\n'
            printf '%s\n' "- Source revision: ${SOURCE_REVISION}"
            printf '%s\n' "- Image: ${IMAGE_REF}"
            printf '%s\n' "- OCI digest: ${digest}"
            printf '%s\n' '- Build architecture: `linux/amd64`'
          } >> "${GITHUB_STEP_SUMMARY}"
          PUBLISHED_DIGEST="${digest}" python3 - <<'PY'
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"]).read_text(encoding="utf-8")
          required = [
              "## Published fork image",
              f"- Source revision: {os.environ['SOURCE_REVISION']}",
              f"- Image: {os.environ['IMAGE_REF']}",
              f"- OCI digest: {os.environ['PUBLISHED_DIGEST']}",
              "- Build architecture: `linux/amd64`",
          ]
          missing = [line for line in required if line not in summary]
          if missing:
              raise SystemExit(f"Publish summary is missing expected lines: {missing!r}")
          PY

      - name: Remove registry credentials from the runner
        if: always()
        run: docker logout ghcr.io || true

  verify-published:
    name: Pull and qualify published Compose image
    if: ${{ github.ref == 'refs/heads/sindri' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      - name: Verify the published image, Compose update and rollback
        env:
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_REF: ghcr.io/gonecrzy/pulse:${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: deploy/sindri/verify-compose.sh "${IMAGE_REF}" "${IMAGE_DIGEST}" "${SOURCE_REVISION}"

      - name: Remove registry credentials from the runner
        if: always()
        run: docker logout ghcr.io || true

      - name: Record published image acceptance
        env:
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_REF: ghcr.io/gonecrzy/pulse:${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            printf '%s\n' '## Published image and Compose acceptance'
            printf '\n'
            printf '%s\n' "- Source revision: ${SOURCE_REVISION}"
            printf '%s\n' "- Image: ${IMAGE_REF}"
            printf '%s\n' "- OCI digest: ${IMAGE_DIGEST}"
            printf '%s\n' '- Runtime: healthy on `linux/amd64`; `/api/health` passed.'
            printf '%s\n' '- Compose: SHA-tag deployment, restart persistence, digest-reference update, rollback, and data-volume retention passed.'
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"]).read_text(encoding="utf-8")
          required = [
              "## Published image and Compose acceptance",
              f"- Source revision: {os.environ['SOURCE_REVISION']}",
              f"- Image: {os.environ['IMAGE_REF']}",
              f"- OCI digest: {os.environ['IMAGE_DIGEST']}",
              "- Runtime: healthy on `linux/amd64`; `/api/health` passed.",
              "- Compose: SHA-tag deployment, restart persistence, digest-reference update, rollback, and data-volume retention passed.",
          ]
          missing = [line for line in required if line not in summary]
          if missing:
              raise SystemExit(f"Compose summary is missing expected lines: {missing!r}")
          PY
