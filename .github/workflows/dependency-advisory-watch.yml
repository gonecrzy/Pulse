name: Dependency Advisory Watch

# A new npm advisory against an unchanged lockfile can outlive an individual
# pull request. This manually run check audits the current default branch's
# frontend manifest and lockfile, reports new advisories, and never installs or
# executes code fetched from the audited branch. It uses no upstream releases,
# release branches, or private repository credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-advisory-watch
  cancel-in-progress: false

jobs:
  audit:
    name: Audit frontend dependencies (default branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout watch helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read default branch lockfile inputs
        env:
          AUDITED: ${{ runner.temp }}/audited
          AUDITED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p "${AUDITED}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${AUDITED_BRANCH}:refs/remotes/audited/head"
          printf 'AUDITED_BRANCH=%s\n' "${AUDITED_BRANCH}"
          printf 'AUDITED_DEFAULT_SHA=%s\n' "$(git rev-parse refs/remotes/audited/head)"
          for file in package.json package-lock.json; do
            git show "refs/remotes/audited/head:frontend-modern/${file}" > "${AUDITED}/${file}"
          done

      # Same Node.js and audit runner as the required build-and-test Frontend
      # job. npm audit reads the lockfile, so no install is needed and no
      # package from the audited branch is fetched or run. The runner always
      # comes from this workflow's own commit, never the fetched branch source.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # setup-node enables npm caching by itself once package.json names
          # npm as its packageManager; keep this scheduled job cache-free.
          package-manager-cache: false

      - name: Audit complete frontend dependency graph
        id: audit
        working-directory: ${{ runner.temp }}/audited
        env:
          NPM_AUDIT_REQUIRE_RESULT: 'true'
        run: |
          set -o pipefail
          bash "$GITHUB_WORKSPACE/scripts/npm-audit-retry.sh" all 2>&1 | tee "$RUNNER_TEMP/npm-audit.log"

      - name: Report advisories and fix
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python3 scripts/dependency_advisory_watch.py summary \
            --branch "${BRANCH}" \
            --outcome "${AUDIT_OUTCOME}" \
            --log "$RUNNER_TEMP/npm-audit.log" \
            --summary-file "$GITHUB_STEP_SUMMARY"
